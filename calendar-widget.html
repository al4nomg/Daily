<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronicle</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg: #0e0b08;
  --surface: #181310;
  --surface2: #201a12;
  --surface3: #282218;
  --border: #2e2318;
  --border2: #3e3228;
  --text: #f0e8dc;
  --text2: #d4c8b8;
  --muted: #6a5a48;
  --muted2: #9a8a78;
  --accent: #c4904f;
  --accent2: #e0b47a;
  --accent3: #f5d090;
  --green: #7aaa88;
  --red: #c06060;
  --blue: #6a9aaa;
  --purple: #9a7aaa;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 32px 20px 60px;
  overflow-x: hidden;
  position: relative;
}

/* Scanlines */
body::after {
  content:''; position:fixed; inset:0;
  background: repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.025) 3px,rgba(0,0,0,0.025) 4px);
  pointer-events:none; z-index:200;
}

/* Orbs */
.orb { position:fixed; border-radius:50%; filter:blur(100px); pointer-events:none; }
.orb-1 { width:500px;height:500px; background:radial-gradient(circle,#c4904f,transparent); top:-150px;right:-120px; opacity:0.08; animation:o1 16s ease-in-out infinite; }
.orb-2 { width:300px;height:300px; background:radial-gradient(circle,#7a5c3a,transparent); bottom:-80px;left:-80px; opacity:0.07; animation:o2 20s ease-in-out infinite; }
.orb-3 { width:250px;height:250px; background:radial-gradient(circle,#6a9aaa,transparent); top:45%;left:5%; opacity:0.05; animation:o3 25s ease-in-out infinite; }
@keyframes o1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-25px,35px) scale(1.05)}}
@keyframes o2{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-40px)}}
@keyframes o3{0%,100%{transform:translate(0,0);opacity:.05}50%{transform:translate(20px,-25px);opacity:.08}}

/* ── APP ── */
.app { width:960px; position:relative; z-index:1; animation:fadeUp .7s cubic-bezier(.16,1,.3,1) forwards; }

/* ── TOPBAR ── */
.topbar {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:22px; padding-bottom:18px;
  border-bottom:1px solid var(--border);
  position:relative;
}
.topbar::after {
  content:''; position:absolute; bottom:-1px; left:0;
  height:1px; width:0;
  background:linear-gradient(to right,var(--accent),var(--accent2) 30%,transparent 70%);
  animation:lineGrow 1.2s .2s cubic-bezier(.16,1,.3,1) forwards;
}
.brand { display:flex; align-items:baseline; gap:12px; }
.app-title {
  font-family:'Cormorant Garamond',serif;
  font-size:34px; font-weight:600;
  letter-spacing:.04em; color:var(--text);
  line-height:1;
  text-shadow: 0 0 40px rgba(196,144,79,.2);
}
.app-sub {
  font-family:'Share Tech Mono',monospace;
  font-size:10px; letter-spacing:.3em;
  color:var(--muted2); text-transform:uppercase;
}
.live-clock {
  font-family:'Share Tech Mono',monospace;
  font-size:22px; letter-spacing:.15em;
  color:var(--accent2);
  text-shadow: 0 0 20px rgba(224,180,122,.3);
  animation:clockPulse 1s ease-in-out infinite;
}

.topbar-right { display:flex; align-items:center; gap:10px; }

.btn-new-event {
  display:flex; align-items:center; gap:7px;
  background:none; border:1px solid var(--accent);
  border-radius:2px; padding:9px 16px;
  color:var(--accent2); cursor:pointer;
  font-family:'Inter',sans-serif;
  font-size:10px; font-weight:400;
  letter-spacing:.18em; text-transform:uppercase;
  transition:all .22s; position:relative; overflow:hidden;
}
.btn-new-event::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  transform:translateX(-101%);
  transition:transform .3s cubic-bezier(.16,1,.3,1); z-index:0;
}
.btn-new-event:hover::before{transform:translateX(0);}
.btn-new-event:hover{color:#0e0b08; box-shadow:0 0 20px rgba(196,144,79,.3);}
.btn-new-event span,.btn-new-event svg{position:relative;z-index:1;}

.view-switch {
  display:flex; border:1px solid var(--border2);
  border-radius:2px; overflow:hidden; position:relative;
}
.view-ind {
  position:absolute; top:0;bottom:0;
  background:var(--surface3);
  transition:left .3s cubic-bezier(.34,1.2,.64,1),width .3s;
  pointer-events:none;
}
.view-btn {
  padding:8px 16px; background:none; border:none;
  color:var(--muted2); cursor:pointer;
  font-family:'Inter',sans-serif; font-size:10px; font-weight:400;
  letter-spacing:.18em; text-transform:uppercase;
  transition:color .2s; position:relative; z-index:1;
  border-right:1px solid var(--border);
}
.view-btn:last-child{border-right:none;}
.view-btn.active{color:var(--accent2); font-weight:500;}
.view-btn:hover:not(.active){color:var(--text);}

.btn-today {
  background:none; border:1px solid var(--border2);
  border-radius:2px; padding:8px 14px;
  color:var(--muted2); cursor:pointer;
  font-family:'Share Tech Mono',monospace;
  font-size:9px; letter-spacing:.2em;
  text-transform:uppercase; transition:all .2s;
}
.btn-today:hover{border-color:var(--accent);color:var(--accent2);}

/* ── LAYOUT ── */
.layout { display:grid; grid-template-columns:1fr 260px; gap:20px; }

/* ── CAL HEADER ── */
.cal-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:14px;
}
.nav-btn {
  background:none; border:1px solid var(--border2);
  border-radius:2px; width:34px; height:34px;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted2); cursor:pointer;
  transition:all .22s;
}
.nav-btn:hover{border-color:var(--accent);color:var(--accent2); box-shadow:0 0 10px rgba(196,144,79,.15);}
.nav-btn:active{transform:scale(.92);}

.month-label {
  font-family:'Cormorant Garamond',serif;
  font-size:28px; font-weight:600;
  letter-spacing:.06em; color:var(--text);
  display:flex; align-items:baseline; gap:12px;
  transition:all .3s;
}
.year-label {
  font-family:'Share Tech Mono',monospace;
  font-size:14px; color:var(--muted2);
  letter-spacing:.1em; font-weight:400;
}

/* ── MONTH GRID ── */
.day-headers {
  display:grid; grid-template-columns:repeat(7,1fr);
  margin-bottom:4px; gap:2px;
}
.day-head {
  text-align:right; padding:6px 10px 6px 0;
  font-family:'Share Tech Mono',monospace;
  font-size:9px; letter-spacing:.22em;
  color:var(--muted); text-transform:uppercase;
  font-weight:400;
}
.day-head.weekend { color:var(--accent); opacity:.5; }

.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }

.day-cell {
  min-height:96px; padding:9px 8px 8px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:2px; cursor:pointer;
  position:relative; overflow:hidden;
  transition:background .18s, border-color .18s, transform .15s, box-shadow .2s;
  animation:cellIn .4s cubic-bezier(.16,1,.3,1) both;
}
/* Hover shimmer */
.day-cell::after {
  content:'';
  position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(196,144,79,.06),transparent 60%);
  opacity:0; transition:opacity .2s;
}
.day-cell:hover { background:var(--surface2); border-color:var(--border2); transform:translateY(-1px); box-shadow:0 4px 16px rgba(0,0,0,.3); }
.day-cell:hover::after{opacity:1;}

/* Top accent line */
.day-cell::before {
  content:''; position:absolute; top:0;left:0;right:0; height:2px;
  background:linear-gradient(to right,var(--accent),transparent);
  opacity:0; transition:opacity .2s;
}
.day-cell:hover::before{opacity:.6;}

.day-cell.other-month { opacity:.3; }
.day-cell.today {
  border-color:var(--accent);
  background:var(--surface2);
  box-shadow:0 0 20px rgba(196,144,79,.12), inset 0 0 30px rgba(196,144,79,.04);
}
.day-cell.today::before{opacity:1;}
.day-cell.weekend-col{background:rgba(14,11,8,.4);}

.day-num {
  font-family:'Share Tech Mono',monospace;
  font-size:12px; letter-spacing:.05em;
  color:var(--muted2); line-height:1;
  margin-bottom:5px; display:flex; align-items:center; gap:4px;
  font-weight:400;
  transition:color .2s;
}
.day-cell:hover .day-num { color:var(--text2); }

.today-dot {
  display:inline-flex; align-items:center; justify-content:center;
  width:20px; height:20px; border-radius:50%;
  background:var(--accent);
  color:#0e0b08; font-size:11px;
  font-family:'Share Tech Mono',monospace;
  font-weight:400; letter-spacing:0;
  box-shadow:0 0 10px rgba(196,144,79,.5);
  animation:todayGlow 2s ease-in-out infinite;
}

.event-chip {
  font-size:9.5px; font-weight:400;
  letter-spacing:.03em; padding:2px 7px;
  border-radius:1px; margin-bottom:2px;
  overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; cursor:pointer;
  transition:all .18s; line-height:1.5;
  border-left:2px solid transparent;
  display:block;
}
.event-chip:hover { filter:brightness(1.25); transform:translateX(2px); }

.more-events {
  font-family:'Share Tech Mono',monospace;
  font-size:8px; color:var(--muted2);
  letter-spacing:.12em; padding:1px 4px;
}

/* ── WEEK VIEW ── */
.week-wrap { overflow-y:auto; max-height:560px; border:1px solid var(--border); border-radius:2px; }
.week-grid { display:grid; grid-template-columns:52px repeat(7,1fr); }

.wk-time-col { background:var(--surface2); border-right:1px solid var(--border); position:sticky; left:0; z-index:3; }
.wk-day-col { border-right:1px solid var(--border); position:relative; }
.wk-day-col:last-child{border-right:none;}
.wk-day-col.today-col { background:rgba(196,144,79,.025); }

.wk-head {
  padding:10px 8px; text-align:center;
  background:var(--surface2); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:4;
}
.wk-time-head { background:var(--surface2); border-bottom:1px solid var(--border); height:55px; position:sticky; top:0; z-index:4; }
.wk-day-name {
  font-family:'Share Tech Mono',monospace;
  font-size:9px; letter-spacing:.2em;
  color:var(--muted2); text-transform:uppercase; margin-bottom:2px;
}
.wk-day-num {
  font-family:'Cormorant Garamond',serif;
  font-size:22px; font-weight:600;
  color:var(--text2); line-height:1;
}
.today-col .wk-day-num { color:var(--accent2); text-shadow:0 0 15px rgba(224,180,122,.4); }
.wk-day-col.today-col .wk-day-name { color:var(--accent); }

.wk-time-cell {
  height:52px; background:var(--surface2);
  border-bottom:1px solid var(--border);
  display:flex; align-items:flex-start; padding:5px 6px;
}
.wk-time-lbl {
  font-family:'Share Tech Mono',monospace;
  font-size:8px; color:var(--muted); letter-spacing:.08em;
}
.wk-slot {
  height:52px; border-bottom:1px solid rgba(46,35,24,.5);
  position:relative; cursor:pointer; transition:background .15s;
}
.wk-slot:hover{background:rgba(196,144,79,.05);}
.wk-slot .event-chip {
  position:absolute; left:3px; right:3px; top:3px;
  font-size:9px; margin:0;
}

/* ── SIDEBAR ── */
.sidebar { display:flex; flex-direction:column; gap:16px; }

.mini-cal {
  border:1px solid var(--border); background:var(--surface);
  border-radius:2px; padding:16px; position:relative;
}
.mini-cal::before{content:'';position:absolute;top:6px;left:6px;width:8px;height:8px;border-top:1px solid var(--accent);border-left:1px solid var(--accent);opacity:.3;}
.mini-cal::after{content:'';position:absolute;bottom:6px;right:6px;width:8px;height:8px;border-bottom:1px solid var(--accent);border-right:1px solid var(--accent);opacity:.3;}

.mini-header {
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.mini-month {
  font-family:'Cormorant Garamond',serif;
  font-size:15px; font-weight:600;
  color:var(--text); letter-spacing:.04em;
}
.mini-nav{display:flex;gap:4px;}
.mini-nav-btn {
  background:none;border:none;color:var(--muted2);
  cursor:pointer;padding:3px 6px;font-size:12px;
  transition:color .2s;
}
.mini-nav-btn:hover{color:var(--accent2);}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}
.mini-dh {
  text-align:center;
  font-family:'Share Tech Mono',monospace;
  font-size:7px;letter-spacing:.1em;
  color:var(--muted);padding:3px 0;
  text-transform:uppercase;
}
.mini-day {
  text-align:center;padding:4px 0;
  font-family:'Share Tech Mono',monospace;
  font-size:9px;color:var(--muted2);
  cursor:pointer;border-radius:1px;
  transition:all .15s; border:1px solid transparent;
  position:relative;
}
.mini-day:hover{color:var(--text2);background:var(--surface2);}
.mini-day.today{color:var(--accent2);border-color:rgba(196,144,79,.4); font-weight:500;}
.mini-day.selected{background:var(--accent);color:#0e0b08;border-color:var(--accent);}
.mini-day.other{opacity:.25;}
.mini-day.has-ev::after{content:'';display:block;width:3px;height:3px;background:var(--accent);border-radius:50%;margin:1px auto 0; box-shadow:0 0 3px var(--accent);}

/* ── UPCOMING ── */
.upcoming {
  border:1px solid var(--border); background:var(--surface);
  border-radius:2px; padding:16px; flex:1; position:relative;
  overflow:hidden;
}
.upcoming::before{content:'';position:absolute;top:6px;left:6px;width:8px;height:8px;border-top:1px solid var(--accent);border-left:1px solid var(--accent);opacity:.3;}
.upcoming-title {
  font-family:'Cormorant Garamond',serif;
  font-size:16px; font-weight:600;
  color:var(--text); letter-spacing:.04em;
  margin-bottom:12px; padding-bottom:9px;
  border-bottom:1px solid var(--border);
  position:relative;
}
.upcoming-title::after {
  content:''; position:absolute; bottom:-1px; left:0;
  width:30%; height:1px;
  background:linear-gradient(to right,var(--accent),transparent);
}
.upcoming-item {
  padding:9px 0 9px 12px;
  border-bottom:1px solid rgba(46,35,24,.6);
  cursor:pointer; transition:all .18s;
  position:relative;
}
.upcoming-item::before {
  content:''; position:absolute;
  left:0; top:20%; bottom:20%;
  width:2px; border-radius:1px;
  background:var(--item-col,var(--accent));
  transform:scaleY(0);
  transition:transform .25s cubic-bezier(.34,1.2,.64,1);
}
.upcoming-item:hover::before{transform:scaleY(1);}
.upcoming-item:last-child{border-bottom:none;}
.upcoming-item:hover{background:rgba(196,144,79,.04);padding-left:16px;}
.up-date {
  font-family:'Share Tech Mono',monospace;
  font-size:8px;letter-spacing:.15em;
  color:var(--muted2);text-transform:uppercase;
  margin-bottom:3px;
}
.up-name { font-size:12px; font-weight:400; color:var(--text2); letter-spacing:.03em; }
.no-upcoming {
  font-family:'Cormorant Garamond',serif;
  font-size:14px;font-style:italic;
  color:var(--muted);letter-spacing:.06em;
  text-align:center;padding:20px 0;
}

/* ── MODAL ── */
.modal-overlay {
  position:fixed;inset:0;
  background:rgba(6,4,2,.9);
  backdrop-filter:blur(8px);
  z-index:100; display:none;
  align-items:center;justify-content:center;
}
.modal-overlay.open{display:flex;animation:fadeIn .25s ease;}
.modal {
  width:420px; background:var(--surface);
  border:1px solid var(--border2); padding:30px;
  position:relative;
  animation:modalIn .4s cubic-bezier(.16,1,.3,1) forwards;
  box-shadow:0 32px 80px rgba(0,0,0,.8), 0 0 80px rgba(196,144,79,.07);
}
.modal::before{content:'';position:absolute;top:7px;left:7px;width:10px;height:10px;border-top:1px solid var(--accent);border-left:1px solid var(--accent);opacity:.5;}
.modal::after{content:'';position:absolute;bottom:7px;right:7px;width:10px;height:10px;border-bottom:1px solid var(--accent);border-right:1px solid var(--accent);opacity:.5;}

/* Animated top accent bar */
.modal-bar {
  position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(to right,var(--accent),var(--accent2),transparent);
  animation:barSlide .5s cubic-bezier(.16,1,.3,1) forwards;
}
@keyframes barSlide{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}

.modal-title {
  font-family:'Cormorant Garamond',serif;
  font-size:22px;font-weight:600;
  letter-spacing:.04em;color:var(--text);
  margin-bottom:22px; line-height:1;
}
.modal-date-preview {
  font-family:'Share Tech Mono',monospace;
  font-size:9px;letter-spacing:.2em;
  color:var(--accent2);text-transform:uppercase;
  margin-bottom:4px;
}
.modal-field{margin-bottom:16px;}
.modal-label{
  font-family:'Share Tech Mono',monospace;
  font-size:8px;letter-spacing:.25em;
  text-transform:uppercase;color:var(--muted2);
  margin-bottom:7px;display:block;
}
.modal-input {
  width:100%;background:var(--surface2);
  border:1px solid var(--border);border-radius:2px;
  padding:10px 14px;color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:13px;font-weight:300;
  letter-spacing:.04em;outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.modal-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(196,144,79,.12);}
.modal-input::placeholder{color:var(--muted);}

.modal-row{display:flex;gap:10px;}
.modal-row .modal-field{flex:1;}

/* Color swatches */
.swatches{display:flex;gap:7px;flex-wrap:wrap;}
.swatch {
  width:24px;height:24px;border-radius:50%;
  cursor:pointer;border:2px solid transparent;
  transition:all .22s cubic-bezier(.34,1.56,.64,1);
}
.swatch.sel{border-color:var(--text);transform:scale(1.25);box-shadow:0 0 8px currentColor;}
.swatch:hover{transform:scale(1.15);}

.modal-btns{display:flex;gap:8px;margin-top:22px;}
.btn-cancel{
  flex:1;background:none;border:1px solid var(--border);
  border-radius:2px;padding:10px;color:var(--muted2);cursor:pointer;
  font-family:'Inter',sans-serif;font-size:10px;font-weight:400;
  letter-spacing:.2em;text-transform:uppercase;transition:all .2s;
}
.btn-cancel:hover{border-color:var(--border2);color:var(--text);}
.btn-save{
  flex:2;background:none;border:1px solid var(--accent);
  border-radius:2px;padding:10px;color:var(--accent2);cursor:pointer;
  font-family:'Inter',sans-serif;font-size:10px;font-weight:500;
  letter-spacing:.2em;text-transform:uppercase;
  transition:all .22s;position:relative;overflow:hidden;
}
.btn-save::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  transform:translateX(-101%);
  transition:transform .3s cubic-bezier(.16,1,.3,1);z-index:0;
}
.btn-save:hover::before{transform:translateX(0);}
.btn-save:hover{color:#0e0b08;box-shadow:0 0 20px rgba(196,144,79,.3);}
.btn-save span{position:relative;z-index:1;}
.btn-del{
  background:none;border:1px solid rgba(192,96,96,.35);
  border-radius:2px;padding:10px;color:var(--red);cursor:pointer;
  font-family:'Inter',sans-serif;font-size:10px;font-weight:400;
  letter-spacing:.18em;text-transform:uppercase;transition:all .2s;
}
.btn-del:hover{background:rgba(192,96,96,.12);border-color:var(--red);}

/* Toast */
.toast{
  position:fixed;bottom:30px;left:50%;
  transform:translateX(-50%) translateY(24px);
  background:var(--surface2);
  border:1px solid var(--border2);border-left:3px solid var(--accent);
  padding:11px 22px;font-family:'Share Tech Mono',monospace;
  font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--text2);opacity:0;
  transition:all .35s cubic-bezier(.16,1,.3,1);
  pointer-events:none;z-index:400;white-space:nowrap;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── KEYFRAMES ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes lineGrow{from{width:0}to{width:50%}}
@keyframes cellIn{from{opacity:0;transform:scale(.96) translateY(4px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes modalIn{from{opacity:0;transform:translateY(-16px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes todayGlow{0%,100%{box-shadow:0 0 10px rgba(196,144,79,.5)}50%{box-shadow:0 0 20px rgba(224,180,122,.8)}}
@keyframes clockPulse{0%,100%{opacity:1}50%{opacity:.7}}
@keyframes monthSlide{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* ── MOBILE ── */
@media(max-width:640px){
  body{padding:14px 10px 60px;}
  .app{padding:0;}
  .header{flex-direction:column;align-items:flex-start;gap:10px;}
  .header-right{width:100%;display:flex;justify-content:space-between;align-items:center;}
  .layout{grid-template-columns:1fr;}
  .sidebar{display:none;}
  .day-cell{min-height:60px;padding:6px 4px;}
  .day-num{font-size:11px;}
  .event-dot{display:none;}
  .event-chip{font-size:8px;padding:2px 4px;}
  .modal{width:calc(100vw - 32px);margin:0 16px;}
  .view-tabs{gap:4px;}
  .view-btn{padding:7px 10px;font-size:8px;}
  .btn-today{padding:7px 10px;font-size:8px;}
  .week-time{font-size:8px;}
}
</style>
<script src="/cloud-sync.js"></script>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="toast" id="toast"></div>

<!-- MODAL -->
<div class="modal-overlay" id="overlay" onclick="closeOut(event)">
<div class="modal">
  <div class="modal-bar"></div>
  <div class="modal-date-preview" id="mDatePrev"></div>
  <div class="modal-title" id="mTitle">New Event</div>
  <div class="modal-field">
    <label class="modal-label">Title</label>
    <input class="modal-input" id="mName" type="text" placeholder="What's happening..." maxlength="60"
      onkeydown="if(event.key==='Enter')saveEv()">
  </div>
  <div class="modal-row">
    <div class="modal-field">
      <label class="modal-label">Date</label>
      <input class="modal-input" id="mDate" type="date">
    </div>
    <div class="modal-field">
      <label class="modal-label">Time</label>
      <input class="modal-input" id="mTime" type="time" value="09:00">
    </div>
  </div>
  <div class="modal-field">
    <label class="modal-label">Note</label>
    <input class="modal-input" id="mNote" type="text" placeholder="Optional..." maxlength="80">
  </div>
  <div class="modal-field">
    <label class="modal-label">Color</label>
    <div class="swatches" id="swatches"></div>
  </div>
  <div class="modal-btns" id="mBtns"></div>
</div>
</div>

<div class="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="brand">
      <div class="app-title">Chronicle</div>
      <div class="app-sub">personal calendar</div>
    </div>
    <div class="live-clock" id="clock">00:00:00</div>
    <div class="topbar-right">
      <button class="btn-new-event" onclick="openNew('')">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>New Event</span>
      </button>
      <button class="btn-today" onclick="goToday()">Today</button>
      <div class="view-switch" id="vsw">
        <div class="view-ind" id="vind"></div>
        <button class="view-btn active" onclick="setView('month',0)">Month</button>
        <button class="view-btn" onclick="setView('week',1)">Week</button>
      </div>
    </div>
  </div>

  <!-- LAYOUT -->
  <div class="layout">
    <div id="main"></div>
    <div class="sidebar">
      <div class="mini-cal">
        <div class="mini-header">
          <span class="mini-month" id="miniLbl"></span>
          <div class="mini-nav">
            <button class="mini-nav-btn" onclick="miniNav(-1)">‹</button>
            <button class="mini-nav-btn" onclick="miniNav(1)">›</button>
          </div>
        </div>
        <div class="mini-grid" id="miniG"></div>
      </div>
      <div class="upcoming">
        <div class="upcoming-title">Upcoming</div>
        <div id="upList"></div>
      </div>
    </div>
  </div>
</div>

<script>
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const EV_COLORS=['#c4904f','#e0b47a','#7aaa88','#7a9aaa','#9a7aaa','#b07878','#8aaa7a','#c06060'];

let vDate=new Date(), miniDate=new Date(), view='month';
let events=JSON.parse(localStorage.getItem('chron-ev')||'[]');
let editId=null, selColor=EV_COLORS[0];

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const dKey=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const todayKey=()=>{const t=new Date();return dKey(t.getFullYear(),t.getMonth(),t.getDate());};
function save(){localStorage.setItem('chron-ev',JSON.stringify(events));if(typeof CloudStorage!=='undefined')CloudStorage.set('chron-ev',events);}

// Clock
setInterval(()=>{
  const n=new Date();
  $('clock').textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
},1000);

function toast(msg){
  const t=$('toast');t.textContent=msg;
  t.classList.add('show');clearTimeout(t._);
  t._=setTimeout(()=>t.classList.remove('show'),2200);
}

function setView(v,i){
  view=v;
  document.querySelectorAll('.view-btn').forEach((b,j)=>b.classList.toggle('active',j===i));
  const sw=$('vsw'), bw=sw.offsetWidth/2, ind=$('vind');
  ind.style.left=(i*bw)+'px'; ind.style.width=bw+'px';
  render();
}

function navigate(dir){
  if(view==='month') vDate.setMonth(vDate.getMonth()+dir);
  else vDate.setDate(vDate.getDate()+dir*7);
  render();
}
function goToday(){vDate=new Date();miniDate=new Date();render();}
function miniNav(d){miniDate.setMonth(miniDate.getMonth()+d);renderMini();}

function evOn(k){return events.filter(e=>e.date===k).sort((a,b)=>a.time.localeCompare(b.time));}

function render(){
  if(view==='month') renderMonth();
  else renderWeek();
  renderMini();
  renderUpcoming();
}

// ── MONTH ──
function renderMonth(){
  const y=vDate.getFullYear(),m=vDate.getMonth();
  const first=new Date(y,m,1).getDay();
  const dim=new Date(y,m+1,0).getDate();
  const dip=new Date(y,m,0).getDate();
  const tk=todayKey();

  let h=`<div class="cal-header">
    <button class="nav-btn" onclick="navigate(-1)">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15,18 9,12 15,6"/></svg>
    </button>
    <div class="month-label" style="animation:monthSlide .35s cubic-bezier(.16,1,.3,1)">${MONTHS[m]} <span class="year-label">${y}</span></div>
    <button class="nav-btn" onclick="navigate(1)">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9,18 15,12 9,6"/></svg>
    </button>
  </div>
  <div class="day-headers">
    ${DS.map((d,i)=>`<div class="day-head${i===0||i===6?' weekend':''}">${d}</div>`).join('')}
  </div>
  <div class="cal-grid">`;

  let cells=[];
  for(let i=first-1;i>=0;i--) cells.push({d:dip-i,key:dKey(m===0?y-1:y,m===0?11:m-1,dip-i),other:true,wkd:(first-1-i)%7});
  for(let d=1;d<=dim;d++) cells.push({d,key:dKey(y,m,d),other:false,wkd:(first+d-1)%7});
  while(cells.length<42) {const d=cells.length-first-dim+1;cells.push({d,key:dKey(m===11?y+1:y,m===11?0:m+1,d),other:true,wkd:cells.length%7});}

  cells.forEach(({d,key,other,wkd},i)=>{
    const isToday=key===tk;
    const evs=evOn(key);
    const isWkd=wkd===0||wkd===6;
    const cls=['day-cell',other?'other-month':'',isToday?'today':'',isWkd&&!other?'weekend-col':''].filter(Boolean).join(' ');

    const chips=evs.slice(0,3).map(e=>`
      <div class="event-chip" style="background:${e.color}28;border-left-color:${e.color};color:${e.color}"
        onclick="event.stopPropagation();openEdit('${e.id}')">${e.time?e.time+' ':''}${e.title}</div>`).join('');
    const more=evs.length>3?`<div class="more-events">+${evs.length-3} more</div>`:'';

    const numHTML=isToday
      ?`<span class="today-dot">${d}</span>`
      :`${d}`;

    h+=`<div class="${cls}" style="animation-delay:${i*.006}s" onclick="openNew('${key}')">
      <div class="day-num">${numHTML}</div>
      ${chips}${more}
    </div>`;
  });

  h+=`</div>`;
  $('main').innerHTML=h;
}

// ── WEEK ──
function renderWeek(){
  const d=new Date(vDate);
  d.setDate(d.getDate()-d.getDay());
  const tk=todayKey();
  const days=Array.from({length:7},(_,i)=>{
    const day=new Date(d); day.setDate(d.getDate()+i);
    const key=dKey(day.getFullYear(),day.getMonth(),day.getDate());
    return {day,key,isToday:key===tk};
  });
  const wStart=days[0].day, wEnd=days[6].day;
  const label=`${wStart.getDate()} ${MONTHS[wStart.getMonth()].slice(0,3)} — ${wEnd.getDate()} ${MONTHS[wEnd.getMonth()].slice(0,3)} ${wEnd.getFullYear()}`;

  let cols=`<div class="wk-time-col"><div class="wk-time-head"></div>`;
  for(let h=0;h<24;h++) cols+=`<div class="wk-time-cell"><span class="wk-time-lbl">${pad(h)}:00</span></div>`;
  cols+=`</div>`;

  days.forEach(({day,key,isToday})=>{
    const evs=evOn(key);
    let col=`<div class="wk-day-col${isToday?' today-col':''}">
      <div class="wk-head">
        <div class="wk-day-name">${DS[day.getDay()]}</div>
        <div class="wk-day-num">${day.getDate()}</div>
      </div>`;
    for(let h=0;h<24;h++){
      const slotEvs=evs.filter(e=>e.time&&parseInt(e.time)===h);
      const evHTML=slotEvs.map(e=>`<div class="event-chip" style="background:${e.color}28;border-left-color:${e.color};color:${e.color}"
        onclick="event.stopPropagation();openEdit('${e.id}')">${e.title}</div>`).join('');
      col+=`<div class="wk-slot" onclick="openNew('${key}','${pad(h)}:00')">${evHTML}</div>`;
    }
    col+=`</div>`;
    cols+=col;
  });

  $('main').innerHTML=`
  <div class="cal-header">
    <button class="nav-btn" onclick="navigate(-1)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15,18 9,12 15,6"/></svg></button>
    <div class="month-label" style="font-size:22px;animation:monthSlide .35s cubic-bezier(.16,1,.3,1)">${label}</div>
    <button class="nav-btn" onclick="navigate(1)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9,18 15,12 9,6"/></svg></button>
  </div>
  <div class="week-wrap"><div class="week-grid">${cols}</div></div>`;
}

// ── MINI ──
function renderMini(){
  const y=miniDate.getFullYear(),m=miniDate.getMonth();
  const first=new Date(y,m,1).getDay();
  const dim=new Date(y,m+1,0).getDate();
  const dip=new Date(y,m,0).getDate();
  const tk=todayKey();

  $('miniLbl').textContent=`${MONTHS[m].slice(0,3)} ${y}`;
  let h=DS.map(d=>`<div class="mini-dh">${d[0]}</div>`).join('');

  for(let i=first-1;i>=0;i--) h+=`<div class="mini-day other">${dip-i}</div>`;
  for(let d=1;d<=dim;d++){
    const k=dKey(y,m,d);
    const hasEv=events.some(e=>e.date===k);
    const cls=['mini-day',k===tk?'today':'',hasEv?'has-ev':''].filter(Boolean).join(' ');
    h+=`<div class="${cls}" onclick="jumpTo('${k}',${y},${m},${d})">${d}</div>`;
  }
  const rem=42-(first+dim);
  for(let d=1;d<=rem;d++) h+=`<div class="mini-day other">${d}</div>`;
  $('miniG').innerHTML=h;
}

function jumpTo(k,y,m,d){
  vDate=new Date(y,m,d);
  if(view==='week') {} else vDate=new Date(y,m,1);
  render(); openNew(k);
}

// ── UPCOMING ──
function renderUpcoming(){
  const tk=todayKey();
  const up=events.filter(e=>e.date>=tk)
    .sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time))
    .slice(0,7);

  if(!up.length){$('upList').innerHTML=`<div class="no-upcoming">no upcoming events</div>`;return;}
  $('upList').innerHTML=up.map(e=>{
    const [y,m,d]=e.date.split('-').map(Number);
    return `<div class="upcoming-item" style="--item-col:${e.color}" onclick="openEdit('${e.id}')">
      <div class="up-date">${d} ${MONTHS[m-1].slice(0,3)}${e.time?' · '+e.time:''}</div>
      <div class="up-name">${e.title}</div>
    </div>`;
  }).join('');
}

// ── MODAL ──
function renderSwatches(){
  $('swatches').innerHTML=EV_COLORS.map(c=>`
    <div class="swatch${c===selColor?' sel':''}" style="background:${c}"
      onclick="selColor='${c}';renderSwatches()"></div>`).join('');
}

function openNew(dk,time=''){
  editId=null; selColor=EV_COLORS[0];
  const today=new Date();
  $('mDatePrev').textContent=dk?formatDatePrev(dk):'';
  $('mTitle').textContent='New Event';
  $('mName').value=''; $('mDate').value=dk||dKey(today.getFullYear(),today.getMonth(),today.getDate());
  $('mTime').value=time||'09:00'; $('mNote').value='';
  $('mBtns').innerHTML=`<button class="btn-cancel" onclick="closeModal()">Cancel</button><button class="btn-save" onclick="saveEv()"><span>Save Event</span></button>`;
  renderSwatches();
  $('overlay').classList.add('open');
  setTimeout(()=>$('mName').focus(),120);
}

function openEdit(id){
  const ev=events.find(e=>e.id===id); if(!ev)return;
  editId=id; selColor=ev.color;
  $('mDatePrev').textContent=formatDatePrev(ev.date);
  $('mTitle').textContent='Edit Event';
  $('mName').value=ev.title; $('mDate').value=ev.date;
  $('mTime').value=ev.time||'09:00'; $('mNote').value=ev.note||'';
  $('mBtns').innerHTML=`
    <button class="btn-del" onclick="delEv('${id}')">Delete</button>
    <button class="btn-cancel" onclick="closeModal()">Cancel</button>
    <button class="btn-save" onclick="saveEv()"><span>Update</span></button>`;
  renderSwatches();
  $('overlay').classList.add('open');
  setTimeout(()=>$('mName').focus(),120);
}

function formatDatePrev(dk){
  const [y,m,d]=dk.split('-').map(Number);
  return `${DS[new Date(y,m-1,d).getDay()]} · ${d} ${MONTHS[m-1].slice(0,3).toUpperCase()} ${y}`;
}

function saveEv(){
  const title=$('mName').value.trim();
  if(!title){$('mName').style.borderColor='var(--red)';setTimeout(()=>$('mName').style.borderColor='',600);return;}
  if(editId){
    const ev=events.find(e=>e.id===editId);
    Object.assign(ev,{title,date:$('mDate').value,time:$('mTime').value,note:$('mNote').value,color:selColor});
    toast('Event updated ✦');
  } else {
    events.push({id:Date.now().toString(),title,date:$('mDate').value,time:$('mTime').value,note:$('mNote').value,color:selColor});
    toast('Event added ✦');
  }
  save();closeModal();render();
}

function delEv(id){
  events=events.filter(e=>e.id!==id);
  save();closeModal();render();toast('Event removed');
}

function closeModal(){$('overlay').classList.remove('open');}
function closeOut(e){if(e.target===$('overlay'))closeModal();}

// ── INIT ──
window.addEventListener('load',()=>{
  const sw=$('vsw'),ind=$('vind');
  ind.style.left='0px'; ind.style.width=(sw.offsetWidth/2)+'px';
  render();
});
</script>
</body>
</html>
