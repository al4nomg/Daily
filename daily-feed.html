
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Feed — Arx Sapientiae</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0e0b08;--surface:#181310;--surface2:#201a12;--surface3:#282218;
  --border:#2e2318;--border2:#3e3228;
  --text:#f0e8dc;--text2:#d4c8b8;--muted:#6a5a48;--muted2:#9a8a78;
  --accent:#c4904f;--accent2:#e0b47a;
  --green:#7aaa88;--blue:#6a9aaa;--purple:#9a7aaa;--red:#c06060;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:300;min-height:100vh;padding:32px 20px 80px;position:relative;overflow-x:hidden;}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.025) 3px,rgba(0,0,0,.025) 4px);pointer-events:none;z-index:200;}
.orb{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;}
.o1{width:500px;height:500px;background:radial-gradient(circle,#c4904f,transparent);top:-150px;right:-100px;opacity:.06;animation:o1 20s ease-in-out infinite;}
.o2{width:300px;height:300px;background:radial-gradient(circle,#9a7aaa,transparent);bottom:-80px;left:-60px;opacity:.05;animation:o2 25s ease-in-out infinite;}
@keyframes o1{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,30px)}}
@keyframes o2{0%,100%{transform:translate(0,0)}50%{transform:translate(25px,-30px)}}
.app{max-width:760px;margin:0 auto;position:relative;z-index:1;animation:fadeUp .7s cubic-bezier(.16,1,.3,1) forwards;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.header{margin-bottom:36px;padding-bottom:16px;border-bottom:1px solid var(--border);position:relative;}
.header::after{content:'';position:absolute;bottom:-1px;left:0;height:1px;width:0;background:linear-gradient(to right,var(--accent),var(--accent2) 40%,transparent 70%);animation:lineGrow 1s .3s forwards;}
@keyframes lineGrow{to{width:60%}}
.title{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;color:var(--text);text-shadow:0 0 40px rgba(196,144,79,.18);letter-spacing:.02em;}
.subtitle{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.28em;color:var(--muted2);text-transform:uppercase;margin-top:5px;}
.header-meta{display:flex;align-items:center;justify-content:space-between;margin-top:14px;}
.today-label{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.2em;color:var(--muted2);text-transform:uppercase;}
.today-label span{color:var(--accent2);}
.refresh-btn{background:none;border:1px solid var(--border2);border-radius:2px;padding:5px 12px;color:var(--muted2);cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:.15em;text-transform:uppercase;transition:all .2s;display:flex;align-items:center;gap:6px;}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent2);}
.refresh-btn svg{transition:transform .5s;}
.refresh-btn.spinning svg{animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.refresh-btn:disabled{opacity:.35;pointer-events:none;}
.feed-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
@media(max-width:560px){.feed-grid{grid-template-columns:1fr;}}
.feed-card{background:var(--surface);border:1px solid var(--border);border-radius:2px;padding:24px 22px;position:relative;overflow:hidden;min-height:190px;display:flex;flex-direction:column;}
.feed-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--fc-col);opacity:.7;}
.feed-card::after{content:'';position:absolute;top:6px;left:6px;width:8px;height:8px;border-top:1px solid var(--fc-col);border-left:1px solid var(--fc-col);opacity:.25;}
.quote-card{--fc-col:var(--accent2);}
.question-card{--fc-col:var(--purple);}
.fc-type{font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:.28em;color:var(--muted2);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:7px;}
.fc-dot{width:5px;height:5px;border-radius:50%;background:var(--fc-col);flex-shrink:0;}
.skeleton{background:linear-gradient(90deg,var(--surface2) 25%,var(--surface3) 50%,var(--surface2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:2px;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk{height:13px;margin-bottom:10px;}
.sk.w90{width:90%;}.sk.w70{width:70%;}.sk.w50{width:50%;height:10px;}.sk.w35{width:35%;height:9px;margin-top:12px;}
.fc-qmark{font-family:'Cormorant Garamond',serif;font-size:48px;line-height:.55;color:var(--accent);opacity:.2;margin-bottom:8px;user-select:none;}
.fc-text{font-family:'Cormorant Garamond',serif;font-size:17px;font-style:italic;color:var(--text2);line-height:1.55;letter-spacing:.02em;flex:1;}
.fc-author{font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:.18em;color:var(--muted);margin-top:12px;text-transform:uppercase;}
.fc-qlabel{font-family:'Share Tech Mono',monospace;font-size:7px;letter-spacing:.22em;color:var(--purple);text-transform:uppercase;margin-bottom:10px;opacity:.7;}
.fc-qtext{font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--text2);line-height:1.55;letter-spacing:.02em;flex:1;}
.fc-hint{font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:.15em;color:var(--muted);margin-top:12px;text-transform:uppercase;}
.fc-actions{display:flex;gap:7px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border);}
.fc-btn{background:none;border:1px solid var(--border2);border-radius:2px;padding:5px 11px;color:var(--muted2);cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:7px;letter-spacing:.15em;text-transform:uppercase;transition:all .2s;}
.fc-btn:hover{border-color:var(--fc-col);color:var(--text2);}
.fc-btn.hi{border-color:var(--fc-col);color:var(--fc-col);}
.fc-btn.hi:hover{background:rgba(255,255,255,.04);}
.history-section{margin-top:8px;}
.hist-label{font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.hist-label::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--border2),transparent);}
.hist-item{background:var(--surface);border:1px solid var(--border);border-radius:2px;padding:12px 16px;display:flex;gap:14px;align-items:flex-start;margin-bottom:6px;transition:border-color .18s;}
.hist-item:hover{border-color:var(--border2);}
.hist-date{font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;width:58px;flex-shrink:0;margin-top:2px;}
.hist-body{flex:1;}
.hist-quote{font-family:'Cormorant Garamond',serif;font-size:13px;font-style:italic;color:var(--muted2);line-height:1.4;}
.hist-q{font-family:'Cormorant Garamond',serif;font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35;}
.hist-del{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px;transition:color .15s;flex-shrink:0;}
.hist-del:hover{color:var(--red);}









.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(24px);background:var(--surface2);border:1px solid var(--border2);border-left:3px solid var(--accent);padding:10px 22px;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--text2);opacity:0;transition:all .3s cubic-bezier(.16,1,.3,1);pointer-events:none;z-index:400;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<div class="toast" id="toast"></div>
<div class="app">

<div class="header">
  <div class="title">Daily Feed</div>
  <div class="subtitle">Arx Sapientiae · generado por Claude cada día</div>
  <div class="header-meta">
    <div class="today-label">Hoy · <span id="todayStr">—</span></div>
    <button class="refresh-btn" id="refreshBtn" onclick="generateToday(true)">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="23,4 23,10 17,10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Regenerar
    </button>
  </div>
</div>

</div>

<div class="feed-grid">
  <div class="feed-card quote-card">
    <div class="fc-type"><span class="fc-dot"></span>Frase del día</div>
    <div id="quoteContent">
      <div class="skeleton sk w90"></div>
      <div class="skeleton sk w70"></div>
      <div class="skeleton sk w50"></div>
      <div class="skeleton sk w35"></div>
    </div>
  </div>
  <div class="feed-card question-card">
    <div class="fc-type"><span class="fc-dot" style="background:var(--purple)"></span>Pregunta del día</div>
    <div id="questionContent">
      <div class="skeleton sk w90"></div>
      <div class="skeleton sk w70"></div>
      <div class="skeleton sk w50"></div>
    </div>
  </div>
</div>

<div id="historySection" style="display:none">
  <div class="history-section">
    <div class="hist-label">Días anteriores</div>
    <div id="histList"></div>
  </div>
</div>

</div>
<script>
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS_ES=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

function toast(msg,col){
  const t=$('toast');t.textContent=msg;t.style.borderLeftColor=col||'var(--accent)';
  t.classList.add('show');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('show'),2500);
}

const todayKey=()=>{const n=new Date();return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`;};
const fmtKey=k=>{const[y,m,d]=k.split('-').map(Number);return `${d} ${MONTHS[m-1]}`;};

function getCache(){return JSON.parse(localStorage.getItem('daily-feed-cache')||'{}');}
function setCache(c){localStorage.setItem('daily-feed-cache',JSON.stringify(c));}


// Publish to shared 'daily-feed' key so other widgets can read
function publishShared(entry){
  let feed=JSON.parse(localStorage.getItem('daily-feed')||'{"quotes":[],"prompts":[]}');
  if(entry.quote&&!feed.quotes.some(q=>q.text===entry.quote.text)){
    feed.quotes.unshift({id:'q'+Date.now(),text:entry.quote.text,author:entry.quote.author||'',fav:false});
    if(feed.quotes.length>40) feed.quotes=feed.quotes.slice(0,40);
  }
  if(entry.question&&!feed.prompts.some(p=>p.text===entry.question)){
    feed.prompts.unshift({id:'p'+Date.now(),text:entry.question,type:'reflect',fav:false});
    if(feed.prompts.length>40) feed.prompts=feed.prompts.slice(0,40);
  }
  localStorage.setItem('daily-feed',JSON.stringify(feed));
}

function renderEntry(entry){
  const qt=entry.quote?.text||'';
  const qa=entry.quote?.author||'';
  const qq=entry.question||'';
  $('quoteContent').innerHTML=`
    <div class="fc-qmark">"</div>
    <div class="fc-text">${qt}</div>
    <div class="fc-author">— ${qa}</div>
    <div class="fc-actions">
      <button class="fc-btn hi" onclick='copyText("${qt.replace(/"/g,'&quot;')} — ${qa}")'>Copiar</button>
      <button class="fc-btn" onclick='toBoard("${qt.replace(/"/g,'&quot;')}","${qa.replace(/"/g,'&quot;')}")'>→ Board</button>
    </div>`;
  $('questionContent').innerHTML=`
    <div class="fc-qlabel">Reflexión de hoy</div>
    <div class="fc-qtext">${qq}</div>
    <div class="fc-hint">Abrí el Scriptorium para responder</div>
    <div class="fc-actions">
      <button class="fc-btn hi" style="--fc-col:var(--purple)" onclick='toScriptorium("${qq.replace(/"/g,'&quot;')}")'>→ Scriptorium</button>
    </div>`;
}

function renderHistory(){
  const cache=getCache();
  const today=todayKey();
  const past=Object.keys(cache).filter(k=>k!==today).sort().reverse().slice(0,5);
  $('historySection').style.display=past.length?'block':'none';
  $('histList').innerHTML=past.map(k=>{
    const e=cache[k];
    return `<div class="hist-item">
      <div class="hist-date">${fmtKey(k)}</div>
      <div class="hist-body">
        <div class="hist-quote">"${e.quote?.text||'—'}"${e.quote?.author?' — '+e.quote.author:''}</div>
        <div class="hist-q">↳ ${e.question||'—'}</div>
      </div>
      <button class="hist-del" onclick="delDay('${k}')">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>`;
  }).join('');
}

function delDay(k){const c=getCache();delete c[k];setCache(c);renderHistory();}

async function generateToday(force){
  const key=todayKey();
  const cache=getCache();
  if(!force&&cache[key]){renderEntry(cache[key]);renderHistory();return;}

  // Skeletons
  $('quoteContent').innerHTML='<div class="skeleton sk w90"></div><div class="skeleton sk w70"></div><div class="skeleton sk w50"></div><div class="skeleton sk w35"></div>';
  $('questionContent').innerHTML='<div class="skeleton sk w90"></div><div class="skeleton sk w70"></div><div class="skeleton sk w50"></div>';

  const btn=$('refreshBtn'); btn.disabled=true; btn.classList.add('spinning');

  const n=new Date();
  const mes=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][n.getMonth()];
  const dateStr=`${DAYS_ES[n.getDay()]} ${n.getDate()} de ${mes}`;

  // Build context from recent history to avoid repeating
  const recentKeys=Object.keys(cache).sort().reverse().slice(0,5);
  const recentCtx=recentKeys.length
    ? 'Evitá repetir estos autores o temas recientes:\n'+recentKeys.map(k=>`- ${cache[k].quote?.author||''}: "${cache[k].quote?.text?.slice(0,50)||''}..."`).join('\n')
    : '';

  const prompt=`Sos el generador de contenido diario para el workspace universitario "Arx Sapientiae" de Alan, un estudiante apasionado por la filosofía, literatura clásica y el conocimiento. Lema: "per aspera ad astra".

Hoy es ${dateStr}.
${recentCtx}

Generá el contenido del día. Respondé ÚNICAMENTE con JSON válido, sin markdown ni explicación extra:

{
  "quote": {
    "text": "Una cita poco conocida, que no sea un cliché. Sobre el conocimiento, la lectura, la filosofía, el esfuerzo intelectual o la vida del estudiante. Puede ser en español o inglés. Sin comillas dobles en el texto.",
    "author": "Nombre completo del autor real de esta cita"
  },
  "question": "Una pregunta de reflexión profunda en español para escribir en el journal hoy. Relacionada con el estudio, la filosofía, la identidad, el crecimiento intelectual o la vida universitaria. Que invite a explorar. No de sí/no."
}`;

  try {
    const res=await fetch('/api/claude',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:400,messages:[{role:'user',content:prompt}]}) 
    });
    if(!res.ok){
      const err=await res.json().catch(()=>({}));
      throw new Error(err.error?.message||`HTTP ${res.status}`);
    }
    const data=await res.json();
    const raw=data.content[0].text.replace(/```json|```/g,'').trim();
    const entry=JSON.parse(raw);
    if(!entry.quote?.text||!entry.question) throw new Error('Respuesta con formato inválido');
    cache[key]=entry;
    setCache(cache);
    publishShared(entry);
    renderEntry(entry);
    renderHistory();
    toast('Contenido del día generado ✦');
  } catch(e){
    console.error(e);
    $('quoteContent').innerHTML=`<div style="font-family:'Cormorant Garamond',serif;font-size:14px;font-style:italic;color:var(--muted);line-height:1.6">No se pudo generar.<br><small style="color:var(--red);font-size:11px">${e.message}</small></div>`;
    $('questionContent').innerHTML=`<div style="font-family:'Cormorant Garamond',serif;font-size:14px;font-style:italic;color:var(--muted)">Intentá con el botón "Regenerar".</div>`;
    toast('Error: '+e.message,'var(--red)');

  } finally {
    btn.disabled=false; btn.classList.remove('spinning');
  }
}

function copyText(t){navigator.clipboard?.writeText(t).then(()=>toast('Copiado ✦')).catch(()=>toast('No se pudo copiar','var(--red)'));}

function toBoard(text,author){
  const items=JSON.parse(localStorage.getItem('inspo-items2')||'[]');
  if(items.some(i=>i.text===text)){toast('Ya está en el board');return;}
  items.unshift({id:'i'+Date.now(),type:'quote',text,author,cat:'daily',col:'#e0b47a'});
  localStorage.setItem('inspo-items2',JSON.stringify(items));
  toast('Agregado al Inspiration Board ✦');
}

function toScriptorium(question){
  const entries=JSON.parse(localStorage.getItem('scrip-entries')||'[]');
  entries.unshift({id:'e'+Date.now(),type:'journal',title:'',body:question+'\n\n',tags:['prompt','daily'],date:new Date().toISOString()});
  localStorage.setItem('scrip-entries',JSON.stringify(entries));
  toast('Pregunta cargada en el Scriptorium ✦');
}

// Init
const now=new Date();
$('todayStr').textContent=`${DAYS_ES[now.getDay()]} ${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;
generateToday(false);
</script>
</body>
</html>
