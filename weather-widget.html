<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  html { background: transparent !important; }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: transparent;
    --surface: rgba(26, 21, 17, 0.75);
    --border: #2e2318;
    --border2: #3d3025;
    --text: #d4cbbf;
    --muted: #5c4e3d;
    --muted2: #8a7a68;
    --accent: #b8834a;
    --accent2: #d4a574;
  }

  body {
    background: transparent;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .orb { display: none; }
  .orb-1 {
    width: 280px; height: 280px;
    background: radial-gradient(circle, #b8834a, transparent);
    top: -80px; right: -60px;
    animation: orbFloat1 12s ease-in-out infinite;
  }
  .orb-2 {
    width: 180px; height: 180px;
    background: radial-gradient(circle, #7a5c3a, transparent);
    bottom: -40px; left: -40px;
    animation: orbFloat2 15s ease-in-out infinite;
  }

  @keyframes orbFloat1 {
    0%,100% { transform: translate(0,0) scale(1); }
    50%      { transform: translate(-15px, 25px) scale(1.08); }
  }
  @keyframes orbFloat2 {
    0%,100% { transform: translate(0,0); }
    50%      { transform: translate(20px,-30px); }
  }

  .widget {
    width: 680px;
    padding: 28px 32px;
    border: 1px solid var(--border);
    background: var(--surface);
    position: relative;
    z-index: 1;
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
    box-shadow: inset 0 1px 0 rgba(180,130,80,0.07), 0 0 60px rgba(0,0,0,0.5);
  }

  .widget::before { content:''; position:absolute; top:7px; left:7px; width:10px; height:10px; border:1px solid var(--accent); border-right:none; border-bottom:none; opacity:0.35; }
  .widget::after  { content:''; position:absolute; bottom:7px; right:7px; width:10px; height:10px; border:1px solid var(--accent); border-left:none; border-top:none; opacity:0.35; }

  /* TOP ROW */
  .top {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    margin-bottom: 28px;
    gap: 16px;
  }

  .city-block {}
  .city-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 0.1em;
    color: var(--text);
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 3px;
  }
  .city-sub {
    font-size: 9px;
    letter-spacing: 0.3em;
    color: var(--muted2);
    text-transform: uppercase;
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
  }

  .current-icon {
    font-size: 44px;
    text-align: center;
    line-height: 1;
    animation: iconFloat 4s ease-in-out infinite;
    filter: drop-shadow(0 0 8px rgba(184,131,74,0.2));
  }

  .current-temp {
    text-align: right;
  }
  .temp-main {
    font-family: 'Cormorant Garamond', serif;
    font-size: 38px;
    font-weight: 300;
    color: var(--text);
    line-height: 1;
    letter-spacing: 0.02em;
  }
  .temp-unit {
    font-size: 18px;
    color: var(--muted2);
  }
  .temp-desc {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--muted2);
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* DIVIDER */
  .divider {
    height: 1px;
    background: linear-gradient(to right, transparent, var(--border2), transparent);
    margin-bottom: 22px;
  }

  /* FORECAST ROW */
  .forecast {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .day-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 10px 4px;
    border-radius: 2px;
    transition: background 0.2s;
    cursor: default;
    position: relative;
  }
  .day-card:hover { background: rgba(180,130,80,0.05); }
  .day-card.today { border-bottom: 1px solid var(--accent); }

  .day-name {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted2);
  }
  .day-card.today .day-name { color: var(--accent2); }

  .day-icon {
    font-size: 22px;
    line-height: 1;
    transition: transform 0.3s;
  }
  .day-card:hover .day-icon { transform: translateY(-2px); }

  .day-temps {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .day-high {
    font-size: 12px;
    color: var(--text);
    letter-spacing: 0.02em;
  }
  .day-low {
    font-size: 10px;
    color: var(--muted2);
    letter-spacing: 0.02em;
  }

  /* LOADING / ERROR */
  .state {
    text-align: center;
    padding: 40px 0;
    color: var(--muted2);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .state.error { color: #8b4a4a; }

  /* Loader dots */
  .loader { display: flex; gap: 6px; justify-content: center; align-items: center; }
  .loader span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    animation: loaderBounce 1.2s ease-in-out infinite;
  }
  .loader span:nth-child(2) { animation-delay: 0.2s; }
  .loader span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes loaderBounce {
    0%,80%,100% { transform: scale(0.6); opacity: 0.4; }
    40%          { transform: scale(1); opacity: 1; }
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(10px); }
    to   { opacity:1; transform:translateY(0); }
  }
  @keyframes iconFloat {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="widget" id="widget">
  <div class="state">
    <div class="loader"><span></span><span></span><span></span></div>
  </div>
</div>

<script>
  const API_KEY = 'c1a5e32d9a64e321c1da756632016c2b';
  const CITY = 'Buenos Aires';
  const UNITS = 'metric'; // metric = °C, imperial = °F

  const ICON_MAP = {
    '01d':'☀️','01n':'🌙',
    '02d':'⛅','02n':'🌙',
    '03d':'☁️','03n':'☁️',
    '04d':'☁️','04n':'☁️',
    '09d':'🌧️','09n':'🌧️',
    '10d':'🌦️','10n':'🌧️',
    '11d':'⛈️','11n':'⛈️',
    '13d':'❄️','13n':'❄️',
    '50d':'🌫️','50n':'🌫️',
  };

  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  function icon(code) { return ICON_MAP[code] || '🌡️'; }
  function tempStr(t) { return `${Math.round(t)}°`; }

  async function load() {
    try {
      // Current weather
      const cur = await fetch(
        `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(CITY)}&appid=${API_KEY}&units=${UNITS}`
      ).then(r => r.json());

      // 5-day forecast (3h intervals)
      const fore = await fetch(
        `https://api.openweathermap.org/data/2.5/forecast?q=${encodeURIComponent(CITY)}&appid=${API_KEY}&units=${UNITS}&cnt=40`
      ).then(r => r.json());

      if (cur.cod !== 200) throw new Error(cur.message);

      // Process forecast: pick one entry per day (noon preferred)
      const dayMap = {};
      fore.list.forEach(entry => {
        const d = new Date(entry.dt * 1000);
        const key = d.toDateString();
        if (!dayMap[key]) dayMap[key] = { highs:[], lows:[], icon: entry.weather[0].icon };
        dayMap[key].highs.push(entry.main.temp_max);
        dayMap[key].lows.push(entry.main.temp_min);
        // prefer midday icon
        if (d.getHours() >= 11 && d.getHours() <= 14) dayMap[key].icon = entry.weather[0].icon;
      });

      const days = Object.entries(dayMap).slice(0, 7).map(([key, val]) => ({
        date: new Date(key),
        high: Math.max(...val.highs),
        low:  Math.min(...val.lows),
        icon: val.icon
      }));

      render(cur, days);
    } catch(e) {
      document.getElementById('widget').innerHTML =
        `<div class="state error">Could not load weather<br><small style="opacity:.5">${e.message}</small></div>`;
    }
  }

  function render(cur, days) {
    const todayStr = new Date().toDateString();
    const unitLabel = UNITS === 'metric' ? '°C' : '°F';

    const forecastHTML = days.map((d, i) => {
      const isToday = d.date.toDateString() === todayStr;
      return `
        <div class="day-card ${isToday ? 'today' : ''}">
          <span class="day-name">${isToday ? 'Today' : DAYS[d.date.getDay()]}</span>
          <span class="day-icon">${icon(d.icon)}</span>
          <div class="day-temps">
            <span class="day-high">${tempStr(d.high)}</span>
            <span class="day-low">${tempStr(d.low)}</span>
          </div>
        </div>`;
    }).join('');

    document.getElementById('widget').innerHTML = `
      <div class="top">
        <div class="city-block">
          <div class="city-name">${cur.name}</div>
          <div class="city-sub">Weather</div>
        </div>
        <div class="current-icon">${icon(cur.weather[0].icon)}</div>
        <div class="current-temp">
          <div class="temp-main">${tempStr(cur.main.temp)}<span class="temp-unit">${unitLabel}</span></div>
          <div class="temp-desc">${cur.weather[0].description}</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="forecast">${forecastHTML}</div>
    `;
  }

  load();
  // Refresh every 10 minutes
  setInterval(load, 10 * 60 * 1000);
</script>
</body>
</html>
