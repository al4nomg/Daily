<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Review</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0e0b08;--surface:#181310;--surface2:#201a12;--surface3:#282218;
  --border:#2e2318;--border2:#3e3228;
  --text:#f0e8dc;--text2:#d4c8b8;--muted:#6a5a48;--muted2:#9a8a78;
  --accent:#c4904f;--accent2:#e0b47a;--green:#7aaa88;--red:#c06060;--blue:#6a9aaa;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:300;min-height:100vh;padding:32px 20px 60px;position:relative;}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.025) 3px,rgba(0,0,0,.025) 4px);pointer-events:none;z-index:200;}
.orb{position:fixed;border-radius:50%;filter:blur(110px);pointer-events:none;}
.o1{width:450px;height:450px;background:radial-gradient(circle,#c4904f,transparent);top:-100px;right:-100px;opacity:.07;animation:o1 18s ease-in-out infinite;}
.o2{width:280px;height:280px;background:radial-gradient(circle,#7aaa88,transparent);bottom:-60px;left:-60px;opacity:.05;animation:o2 22s ease-in-out infinite;}
@keyframes o1{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,30px)}}
@keyframes o2{0%,100%{transform:translate(0,0)}50%{transform:translate(25px,-30px)}}
.app{max-width:760px;margin:0 auto;position:relative;z-index:1;animation:fadeUp .6s cubic-bezier(.16,1,.3,1) forwards;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;padding-bottom:16px;border-bottom:1px solid var(--border);position:relative;}
.header::after{content:'';position:absolute;bottom:-1px;left:0;height:1px;width:0;background:linear-gradient(to right,var(--accent),var(--accent2) 40%,transparent 70%);animation:lineGrow 1s .2s forwards;}
@keyframes lineGrow{to{width:55%}}
.title{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;color:var(--text);text-shadow:0 0 40px rgba(196,144,79,.2);}
.subtitle{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.28em;color:var(--muted2);text-transform:uppercase;margin-top:3px;}

.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.nav-btn{background:none;border:1px solid var(--border2);border-radius:2px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--muted2);cursor:pointer;transition:all .2s;}
.nav-btn:hover{border-color:var(--accent);color:var(--accent2);}
.week-info{text-align:center;}
.week-big{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--text);letter-spacing:.04em;}
.week-sub{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.2em;color:var(--muted2);text-transform:uppercase;margin-top:2px;}

.rating-section{background:var(--surface);border:1px solid var(--border);border-radius:2px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden;}
.rating-section::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(to right,var(--accent),var(--accent2),transparent);}
.rating-section::after{content:'';position:absolute;top:6px;left:6px;width:8px;height:8px;border-top:1px solid var(--accent);border-left:1px solid var(--accent);opacity:.3;}
.s-label{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.22em;color:var(--muted2);text-transform:uppercase;margin-bottom:14px;}
.ratings-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.rating-item{display:flex;flex-direction:column;gap:6px;}
.r-name{font-size:11px;color:var(--text2);letter-spacing:.04em;}
.r-stars{display:flex;gap:4px;}
.r-star{cursor:pointer;color:var(--border2);font-size:16px;transition:all .18s cubic-bezier(.34,1.56,.64,1);}
.r-star.on{color:var(--accent2);}
.r-star:hover{transform:scale(1.3);}

.q-section{background:var(--surface);border:1px solid var(--border);border-radius:2px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden;}
.q-section::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(to right,var(--green),transparent 60%);}
.q-section::after{content:'';position:absolute;top:6px;left:6px;width:8px;height:8px;border-top:1px solid var(--green);border-left:1px solid var(--green);opacity:.3;}
.question{margin-bottom:16px;}
.question:last-child{margin-bottom:0;}
.q-text{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:400;font-style:italic;color:var(--text2);letter-spacing:.03em;margin-bottom:8px;line-height:1.4;}
.q-num{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.18em;color:var(--muted2);text-transform:uppercase;margin-bottom:4px;}
.q-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:2px;padding:10px 14px;color:var(--text);font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:300;font-style:italic;letter-spacing:.03em;outline:none;resize:vertical;min-height:64px;transition:border-color .2s;line-height:1.6;}
.q-input:focus{border-color:var(--green);}
.q-input::placeholder{color:var(--muted);}

.int-section{background:var(--surface);border:1px solid var(--border);border-radius:2px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden;}
.int-section::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(to right,var(--blue),transparent 60%);}
.int-section::after{content:'';position:absolute;top:6px;left:6px;width:8px;height:8px;border-top:1px solid var(--blue);border-left:1px solid var(--blue);opacity:.3;}
.int-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.int-item{display:flex;align-items:center;gap:8px;}
.int-bullet{width:5px;height:5px;border-radius:50%;background:var(--blue);flex-shrink:0;}
.int-text{flex:1;background:none;border:none;border-bottom:1px solid var(--border);padding:4px 0;color:var(--text);font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:300;font-style:italic;letter-spacing:.03em;outline:none;transition:border-color .2s;}
.int-text:focus{border-color:var(--blue);}
.int-text::placeholder{color:var(--muted);}
.add-int{background:none;border:none;color:var(--muted2);cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;transition:color .2s;padding:2px 0;}
.add-int:hover{color:var(--accent2);}

.save-btn{width:100%;background:none;border:1px solid var(--accent);border-radius:2px;padding:11px;color:var(--accent2);cursor:pointer;font-family:'Inter',sans-serif;font-size:10px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;transition:all .22s;position:relative;overflow:hidden;margin-top:4px;}
.save-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--accent),var(--accent2));transform:translateX(-101%);transition:transform .3s cubic-bezier(.16,1,.3,1);z-index:0;}
.save-btn:hover::before{transform:translateX(0);}
.save-btn:hover{color:#0e0b08;}
.save-btn span{position:relative;z-index:1;}
.clear-btn{width:100%;background:none;border:1px solid rgba(192,96,96,.3);border-radius:2px;padding:11px;color:var(--red);cursor:pointer;font-family:'Inter',sans-serif;font-size:9px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;transition:all .2s;margin-top:8px;}
.clear-btn:hover{background:rgba(192,96,96,.08);border-color:var(--red);}

.archive{background:var(--surface);border:1px solid var(--border);border-radius:2px;padding:20px;margin-top:14px;}
.arch-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.arch-title{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--text);}
.arch-item{border-bottom:1px solid var(--border);padding:10px 0;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:space-between;position:relative;padding-left:10px;}
.arch-item::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:2px;background:var(--accent);transform:scaleY(0);transition:transform .2s;border-radius:1px;}
.arch-item:hover::before{transform:scaleY(1);}
.arch-item:hover{background:rgba(196,144,79,.03);}
.arch-item:last-child{border-bottom:none;}
.arch-wk{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.15em;color:var(--muted2);text-transform:uppercase;}
.arch-stars{display:flex;gap:2px;}
.arch-star{font-size:10px;color:var(--accent2);}
.del-btn{background:none;border:1px solid rgba(192,96,96,.3);border-radius:2px;padding:2px 7px;color:var(--red);cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:7px;letter-spacing:.12em;transition:all .18s;}
.del-btn:hover{background:rgba(192,96,96,.12);}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(24px);background:var(--surface2);border:1px solid var(--border2);border-left:3px solid var(--accent);padding:10px 20px;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--text2);opacity:0;transition:all .3s cubic-bezier(.16,1,.3,1);pointer-events:none;z-index:400;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* CONFIRM MODAL */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:500;display:flex;align-items:center;justify-content:center;}
.confirm-box{background:var(--surface2);border:1px solid var(--border2);border-left:3px solid var(--red);border-radius:2px;padding:24px 28px;max-width:300px;width:90%;}
.confirm-msg{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:400;color:var(--text);margin-bottom:18px;line-height:1.5;}
.confirm-btns{display:flex;gap:8px;justify-content:flex-end;}
.confirm-yes{background:none;border:1px solid var(--red);border-radius:2px;padding:7px 18px;color:var(--red);cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:.15em;text-transform:uppercase;transition:all .2s;}
.confirm-yes:hover{background:rgba(192,96,96,.15);}
.confirm-no{background:none;border:1px solid var(--border2);border-radius:2px;padding:7px 18px;color:var(--muted2);cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:.15em;text-transform:uppercase;transition:all .2s;}
.confirm-no:hover{background:var(--surface);}

@media(max-width:560px){
  body{padding:14px 10px 60px;}
  .ratings-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .r-star{font-size:20px;}
  .header{flex-direction:column;align-items:flex-start;gap:10px;}
}
</style>
<script src="/cloud-sync.js"></script>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<div class="toast" id="toast"></div>

<!-- CONFIRM MODAL -->
<div id="confirmOverlay" class="confirm-overlay" style="display:none">
  <div class="confirm-box">
    <div class="confirm-msg" id="confirmMsg">Are you sure?</div>
    <div class="confirm-btns">
      <button class="confirm-no" onclick="confirmCancel()">Cancel</button>
      <button class="confirm-yes" onclick="confirmOk()">Confirm</button>
    </div>
  </div>
</div>

<div class="app">
<div class="header">
  <div>
    <div class="title">Weekly Review</div>
    <div class="subtitle">reflection · intentions · growth</div>
  </div>
</div>

<div class="week-nav">
  <button class="nav-btn" onclick="weekNav(-1)">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15,18 9,12 15,6"/></svg>
  </button>
  <div class="week-info">
    <div class="week-big" id="wkLabel"></div>
    <div class="week-sub" id="wkSub"></div>
  </div>
  <button class="nav-btn" onclick="weekNav(1)">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9,18 15,12 9,6"/></svg>
  </button>
</div>

<div class="rating-section">
  <div class="s-label">Rate the week</div>
  <div class="ratings-grid" id="ratingsGrid"></div>
</div>

<div class="q-section">
  <div class="s-label" style="color:var(--green)">Reflection</div>
  <div id="questionsArea"></div>
</div>

<div class="int-section">
  <div class="s-label" style="color:var(--blue)">Next week intentions</div>
  <div class="int-list" id="intList"></div>
  <button class="add-int" onclick="addInt()">+ Add intention</button>
</div>

<button class="save-btn" onclick="saveReview()"><span>Save Review</span></button>
<button class="clear-btn" onclick="clearCurrentWeek()">Clear this week</button>

<div class="archive" style="display:none" id="archiveSection">
  <div class="arch-header">
    <div class="arch-title">Past Reviews</div>
  </div>
  <div id="archiveList"></div>
</div>
</div>

<script>
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');

const RATINGS=[
  {id:'overall',name:'Overall'},{id:'productivity',name:'Productivity'},
  {id:'wellbeing',name:'Wellbeing'},{id:'social',name:'Social'},
  {id:'study',name:'Study'},{id:'self',name:'Self-care'},
];
const QUESTIONS=[
  'What went well this week?',
  "What didn't go as planned?",
  'What did I learn?',
  'What am I grateful for?',
  'What would I do differently?',
];

let reviews={};
let weekOffset=0;
let currentRatings={};
let currentAnswers={};
let intentions=[];

function save(){localStorage.setItem('weekly-rev',JSON.stringify(reviews));if(typeof CloudStorage!=='undefined')CloudStorage.set('weekly-rev',reviews);}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('show'),2200);}

// ── CONFIRM MODAL ──
let _cb=null;
function showConfirm(msg,cb){
  $('confirmMsg').textContent=msg;
  $('confirmOverlay').style.display='flex';
  _cb=cb;
}
function confirmOk(){
  $('confirmOverlay').style.display='none';
  if(_cb){ _cb(); _cb=null; }
}
function confirmCancel(){
  $('confirmOverlay').style.display='none';
  _cb=null;
}

// ── WEEK LOGIC ──
function getWeekNum(d){
  const s=new Date(d.getFullYear(),0,1);
  return Math.ceil((((d-s)/86400000)+s.getDay()+1)/7);
}
function getWeekKey(){
  const d=new Date(); d.setDate(d.getDate()+weekOffset*7);
  const ws=new Date(d); ws.setDate(d.getDate()-d.getDay());
  return d.getFullYear()+'-W'+pad(getWeekNum(ws));
}
function getWeekRange(){
  const d=new Date(); d.setDate(d.getDate()+weekOffset*7);
  const ws=new Date(d); ws.setDate(d.getDate()-d.getDay());
  const we=new Date(ws); we.setDate(ws.getDate()+6);
  return ws.getDate()+' '+MONTHS[ws.getMonth()]+' — '+we.getDate()+' '+MONTHS[we.getMonth()];
}
function weekNav(d){ weekOffset+=d; if(typeof CloudStorage!=="undefined"){CloudStorage.get("weekly-rev").then(d=>{if(d)reviews=d;loadWeek();});}else{try{reviews=JSON.parse(localStorage.getItem("weekly-rev")||"{}")}catch(e){}loadWeek();} }

function loadWeek(){
  const k=getWeekKey();
  const rev=reviews[k]||null;
  currentRatings=rev?.ratings||{};
  currentAnswers=rev?.answers||{};
  intentions=rev?.intentions?.length?rev.intentions:['','',''];
  $('wkLabel').textContent=getWeekRange();
  $('wkSub').textContent=weekOffset===0?'This week — per aspera ad astra':getWeekKey();
  renderRatings();renderQuestions();renderIntentions();renderArchive();
}

function renderRatings(){
  $('ratingsGrid').innerHTML=RATINGS.map(r=>{
    const val=currentRatings[r.id]||0;
    return '<div class="rating-item"><span class="r-name">'+r.name+'</span><div class="r-stars">'+
      [1,2,3,4,5].map(i=>'<span class="r-star'+(i<=val?' on':'')+'" onclick="setRating(\''+r.id+'\','+i+')">★</span>').join('')+
      '</div></div>';
  }).join('');
}
function setRating(id,val){ currentRatings[id]=val; renderRatings(); }

function renderQuestions(){
  $('questionsArea').innerHTML=QUESTIONS.map((q,i)=>
    '<div class="question"><div class="q-num">'+String(i+1).padStart(2,'0')+'</div>'+
    '<div class="q-text">'+q+'</div>'+
    '<textarea class="q-input" id="qa_'+i+'" placeholder="Write your thoughts...">'+
    (currentAnswers[i]||'')+'</textarea></div>'
  ).join('');
  QUESTIONS.forEach((_,i)=>{
    const ta=$('qa_'+i);
    if(ta) ta.addEventListener('input',function(){ currentAnswers[i]=this.value; });
  });
}

function renderIntentions(){
  if(!intentions.length) intentions=[''];
  $('intList').innerHTML=intentions.map((t,i)=>
    '<div class="int-item"><div class="int-bullet"></div>'+
    '<input class="int-text" type="text" value="'+t+'" placeholder="Set an intention..." maxlength="80" '+
    'oninput="intentions['+i+']=this.value"></div>'
  ).join('');
}
function addInt(){ intentions.push(''); renderIntentions(); const ins=document.querySelectorAll('.int-text'); ins[ins.length-1].focus(); }

function saveReview(){
  QUESTIONS.forEach((_,i)=>{ const ta=$('qa_'+i); if(ta) currentAnswers[i]=ta.value.trim(); });
  const k=getWeekKey();
  reviews[k]={ratings:{...currentRatings},answers:{...currentAnswers},intentions:[...intentions].filter(t=>t.trim()),date:new Date().toISOString()};
  save(); renderArchive(); toast('Review saved ✦');
}

function renderArchive(){
  const keys=Object.keys(reviews).sort().reverse().slice(0,8);
  if(!keys.length){ $('archiveSection').style.display='none'; return; }
  $('archiveSection').style.display='block';
  $('archiveList').innerHTML=keys.map(k=>{
    const r=reviews[k];
    const overall=r.ratings?.overall||0;
    const cur=k===getWeekKey();
    return '<div class="arch-item" onclick="jumpToWeek(\''+k+'\')">'+
      '<span class="arch-wk" style="'+(cur?'color:var(--accent2)':'')+'">'+k+(cur?' · this week':'')+'</span>'+
      '<div style="display:flex;align-items:center;gap:10px">'+
      '<div class="arch-stars">'+[1,2,3,4,5].map(i=>'<span class="arch-star" style="'+(i<=overall?'':'opacity:.22')+'">★</span>').join('')+'</div>'+
      '<button class="del-btn" onclick="deleteReview(\''+k+'\',event)">del</button>'+
      '</div></div>';
  }).join('');
}

function jumpToWeek(k){
  const match=k.match(/(\d{4})-W(\d+)/);
  if(!match) return;
  const year=parseInt(match[1]),week=parseInt(match[2]);
  const now=new Date();
  const curWs=new Date(now); curWs.setDate(now.getDate()-now.getDay());
  const curWeekNum=getWeekNum(curWs);
  weekOffset=(year-curWs.getFullYear())*52+(week-curWeekNum);
  loadWeek();
}

function deleteReview(k,e){
  e.stopPropagation();
  showConfirm('Delete this review?', function(){
    delete reviews[k];
    save();
    if(k===getWeekKey()) loadWeek();
    else renderArchive();
    toast('Review deleted');
  });
}

function clearCurrentWeek(){
  const k=getWeekKey();
  if(!reviews[k]){ toast('Nothing saved for this week'); return; }
  showConfirm('Clear this week?', function(){
    delete reviews[k];
    save(); loadWeek(); toast('Cleared ✦');
  });
}

loadWeek();
</script>
</body>
</html>
